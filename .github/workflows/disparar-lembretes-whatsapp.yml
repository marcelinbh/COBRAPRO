name: Disparar lembretes WhatsApp

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validar sem enviar mensagens"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Acionar lembretes elegíveis
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          OIDC_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cobrapro-online-automation-v1" | jq -r '.value')"
          test -n "${OIDC_TOKEN}" && test "${OIDC_TOKEN}" != "null"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 \
            --connect-timeout 10 --max-time 90 \
            --request POST "https://cobrapro.online/api/scheduled/notificacoes" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"dryRun\": ${DRY_RUN}}"
