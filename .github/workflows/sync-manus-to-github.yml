name: Verificar fonte do CobraPro

# A antiga rotina fazia force-push do próprio branch main de cinco em cinco
# minutos. Ela não sincronizava dados do Manus e podia reescrever histórico.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout somente leitura
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Exibir commit verificado
        run: |
          git log --oneline -1
          git status --short
